<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Demanda</title>
    <!-- Ligação ao arquivo CSS externo -->
    <link rel="stylesheet" href="cadastro.css">
    <!-- FontAwesome para os ícones de seta e calendário -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cadastro.js"></script>
</head>

<body>

    <div class="modal">
        <h2 class="modal-title">Nova Demanda</h2>

        <form id="form-cadastro" action="../listagem/listagem.html">
            <div class="form-grid">
                <!-- Título -->
                <div class="form-group">
                    <label>Título:</label>
                    <div class="input-wrapper">
                        <input type="text" name="titulo" class="form-control"
                            placeholder="Digite aqui o nome da demanda">
                    </div>
                </div>

                <!-- Status -->
                <div class="form-group">
                    <label>Status:</label>
                    <div class="input-wrapper">
                        <select name="status" class="form-control">
                            <option value="" disabled selected>Selecione o status</option>
                            <option value="Aberta">Aberta</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Em Revisão">Em Revisão</option>
                            <option value="Concluída">Concluída</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Tipo: -->
                <div class="form-group">
                    <label>Tipo:</label>
                    <div class="input-wrapper">
                        <select name="categoria_id" class="form-control">
                            <option value="" disabled selected>Selecione o tipo</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Responsável: -->
                <div class="form-group">
                    <label>Responsável:</label>
                    <div class="input-wrapper">
                        <select name="responsavel_id" class="form-control">
                            <option value="" disabled selected>Selecione o responsável</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Prioridade:-->
                <div class="form-group">
                    <label>Prioridade:</label>
                    <div class="input-wrapper">
                        <select name="prioridade" class="form-control">
                            <option value="" disabled selected>Selecione a prioridade</option>
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Crítica">Crítica</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Coluna Direita - Linha 3 -->
                <div class="form-group">
                    <label>Projeto:</label>
                    <div class="input-wrapper">
                        <select name="projeto_id" class="form-control">
                            <option value="" disabled selected>Selecione o projeto</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <!-- Coluna Esquerda - Linha 4 -->
                <div class="form-group">
                    <label>Prazo:</label>
                    <div class="input-wrapper">
                        <input type="date" name="prazo_final" class="form-control" placeholder="**/**/**">
                    </div>
                </div>

                <!-- Campo de Descrição -->
                <div class="form-group descricao-completa" style="grid-column: span 2;">
                    <label>Descrição:</label>
                    <div class="input-wrapper">
                        <textarea style="resize: none;"  id="cad-descricao" name="descricao" class="form-control" rows="4"
                            placeholder="Descreva os detalhes da demanda..."></textarea>
                    </div>
                </div>

                <!-- Coluna Direita - Linha 4 (Botão Salvar) -->
                <div class="form-group btn-container">
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
