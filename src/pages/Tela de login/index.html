<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form class="cartao">

    <header class="cabecario"> <H1> Login</H1></header>


<div class="campo">
    <label for="email">Email:</label>
    <input
         type="email" 
         placeholder="Digite seu email aqui"
        name="email"
        id="email"
        required>
</div>

<br>

<div class="campo">
    <label for="senha">Senha:</label>
    <input
        type="password"
        placeholder="Digite sua senha aqui" 
        name="senha"
        id="senha"
        required>
</div>

<div class="botao">
    <button type="submit">Entrar</button>
    <a href="esqueceu" class="esqueceu">Esqueceu a senha?</a>
</div>
</form>






</form>
</body>
</html>
