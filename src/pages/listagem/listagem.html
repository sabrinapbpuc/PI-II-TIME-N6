<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <!-- Importação da fonte Roboto do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <button class="menu-hamburguer">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="overlay" id="menu-overlay"></div>

        <nav class="sidebar" id="sidebar">
            <div class="logo">Painel</div>
            <ul class="nav-menu">
                <li><a href="../Dashboard/index.html">Dashboard</a></li>
                <li><a href="#perfil">Meu Perfil</a></li>
                <li><a href="#config">Configurações</a></li>
                <li><a href="../Tela de login/index.html" class="menu-sair">Sair</a></li>
            </ul>
        </nav>
        
        <p>Sistema de Demandas</p>

    </header>
    <hr class="linha-topo">

    <div class="inicial">
        <h1>Demandas</h1>
        <input type="search" class="barra-busca" name="Busca" id="busca_id"
            placeholder="Pesquise por título ou descrição">
        <p id="mensagem-listagem" role="status" aria-live="polite"></p>
        <a href="../cadastro-demandas/cadastro.html">
            <button class="btn-nova-demanda">+ Nova Demanda</button>
        </a>
    </div>

    <section class="container">
        <section class="filtros">
            <h2>Filtros</h2>
            <hr class="linha-filtros">
            <div class="filtro">
                <div class="selecao-filtro">
                    <label for="status_id">Status</label>
                    <select id="status_id" class="dropbox" name="Status">
                        <option value="">Todos</option>
                        <option value="aberta">Aberta</option>
                        <option value="em_andamento">Em Andamento</option>
                        <option value="em_revisao">Em Revisão</option>
                        <option value="concluida">Concluída</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="prioridade_id">Prioridade</label>
                    <select id="prioridade_id" class="dropbox" name="Prioridade">
                        <option value="">Todos</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="responsavel_id">Responsável</label>
                    <select id="responsavel_id" class="dropbox" name="Responsavel">
                        <option value="">Todos</option>
                        <option value="sem_responsavel">Não Atribuído</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="tipo_id">Tipo</label>
                    <select id="tipo_id" class="dropbox" name="Tipo">
                        <option value="">Todos</option>
                        <option value="tarefa">Tarefa</option>
                        <option value="defeito">Defeito</option>
                        <option value="melhoria">Melhoria</option>
                        <option value="documento">Documento</option>
                    </select>
                </div>
            </div>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Responsável</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
    <script src="listagem.js" defer></script>
</body>

</html>
