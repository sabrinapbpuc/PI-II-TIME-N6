<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Demanda</title>
    <!-- Ligação ao arquivo CSS externo -->
    <link rel="stylesheet" href="edicao.css">
    <script src="edicao.js" defer></script>
</head>

<body>

    <div class="modal">
        <h2 class="modal-title">Edição de Demanda</h2>

        <form id="form-edicao" action="../detalhes/detalhes.html">
            <div class="form-grid">
                <!-- Coluna Esquerda - Linha 1: Nome -->
                <div class="form-group">
                    <label>Nome:</label>
                    <div class="input-wrapper">
                        <input type="text" id="edit-titulo" class="form-control" value="Relatório">
                    </div>
                </div>

                <!-- Coluna Direita - Linha 1: Status -->
                <div class="form-group">
                    <label>Status:</label>
                    <div class="input-wrapper">
                        <select id="edit-status" class="form-control">
                            <option value="Aberta">Aberta</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Em Revisão">Em Revisão</option>
                            <option value="Concluída">Concluída</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                        <span class="icon-select">&#9660;</span>
                    </div>
                </div>

                <!-- Coluna Esquerda - Linha 2: Tipo -->
                <div class="form-group">
                    <label>Tipo:</label>
                    <div class="input-wrapper">
                        <select id="edit-categoria" class="form-control">
                            <option value="" disabled selected>Selecione o tipo</option>
                        </select>
                        <span class="icon-select">&#9660;</span>
                    </div>
                </div>

                <!-- Coluna Direita - Linha 2: Responsável -->
                <div class="form-group">
                    <label>Responsável:</label>
                    <div class="input-wrapper">
                        <select id="edit-responsavel" class="form-control">
                            <option value="" disabled selected>Selecione o responsável</option>
                        </select>
                        <span class="icon-select">&#9660;</span>
                    </div>
                </div>

                <!-- Coluna Esquerda - Linha 3: Prioridade -->
                <div class="form-group">
                    <label>Prioridade:</label>
                    <div class="input-wrapper">
                        <select id="edit-prioridade" class="form-control">
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Crítica">Crítica</option>
                        </select>
                        <span class="icon-select">&#9660;</span>
                    </div>
                </div>

                <!-- Coluna Direita - Linha 3: Projeto -->
                <div class="form-group">
                    <label>Projeto:</label>
                    <div class="input-wrapper">
                        <select id="edit-projeto" class="form-control">
                            <option value="" disabled selected>Selecione o projeto</option>
                        </select>
                        <span class="icon-select">&#9660;</span>
                    </div>
                </div>

                <!-- Coluna Esquerda - Linha 4: Prazo -->
                <div class="form-group">
                    <label>Prazo:</label>
                    <div class="input-wrapper">
                        <input type="date" id="edit-prazo" class="form-control placeholder-gray"
                            placeholder="**/****/*****">
                    </div>
                </div>

                <!-- Campo de Descrição -->
                <div class="form-group descricao-completa" style="grid-column: span 2;">
                    <label>Descrição:</label>
                    <div class="input-wrapper">
                        <textarea style="resize: none;" id="edit-descricao" name="descricao" class="form-control" rows="4"
                            placeholder="Descreva os detalhes da demanda..."></textarea>
                    </div>
                </div>

                <!-- Coluna Direita - Linha 4: Botão Salvar -->
                <div class="form-group btn-container">
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
