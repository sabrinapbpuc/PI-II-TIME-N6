<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <!-- Importação da fonte Roboto do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="menu-hamburguer">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <p>Sistema de Demandas</p>
    </header>
    <hr class="linha-topo">
    
    <div class="inicial">
        <h1>Demandas</h1>
        <input type="search" class="barra-busca" name="Busca" id="busca_id" placeholder="Pesquise por título ou descrição">
        <button class="btn-nova-demanda">+ Nova Demanda</button>
    </div>

    <section class="container">
        <section class="filtros">
            <h2>Filtros</h2>
            <hr class="linha-filtros">
            <div class="filtro">
                <div class="selecao-filtro">
                    <label for="status_id">Status</label>
                    <select id="status_id" class="dropbox" name="Status">
                        <option value="">Todos</option>
                        <option value="aberta">Aberta</option>
                        <option value="em_andamento">Em Andamento</option>
                        <option value="em_revisao">Em Revisão</option>
                        <option value="concluida">Concluída</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="prioridade_id">Prioridade</label>
                    <select id="prioridade_id" class="dropbox" name="Prioridade">
                        <option value="">Todos</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="responsavel_id">Responsável</label>
                    <select id="responsavel_id" class="dropbox" name="Responsavel">
                        <option value="">Todos</option>
                        <option value="sem_responsavel">Não Atribuído</option>
                    </select>
                </div>
                <div class="selecao-filtro">
                    <label for="tipo_id">Tipo</label>
                    <select id="tipo_id" class="dropbox" name="Tipo">
                        <option value="">Todos</option>
                        <option value="tarefa">Tarefa</option>
                        <option value="defeito">Defeito</option>
                        <option value="melhoria">Melhoria</option>
                        <option value="documento">Documento</option>
                    </select>
                </div>
            </div>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Responsável</th>
                </tr>
            </thead>
            <tbody>
                <!-- Linhas limpas sem atributos de link -->
                <tr>
                    <td>Login</td>
                    <td class="txt-mutado">Tarefa</td>
                    <td><span class="badge alta">Alta</span></td>
                    <td class="txt-mutado">Em andamento</td>
                    <td class="txt-mutado">João</td>
                </tr>
                <tr>
                    <td>Erro Cadastro</td>
                    <td class="txt-mutado">Defeito</td>
                    <td><span class="badge critica">Crítica</span></td>
                    <td class="txt-mutado">Em Revisão</td>
                    <td class="txt-mutado">Maria</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
